x-postgres: &postgres
  image: docker.io/library/postgres:17
  environment:
    POSTGRES_USER: flashkart_admin
    POSTGRES_PASSWORD: flashkart-local-admin
    POSTGRES_DB: flashkart
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U flashkart_admin -d flashkart"]
    interval: 2s
    timeout: 3s
    retries: 20

services:
  postgres-a:
    <<: *postgres
    ports: ["127.0.0.1:5541:5432"]
    volumes: ["postgres-a:/var/lib/postgresql/data"]
  postgres-b:
    <<: *postgres
    ports: ["127.0.0.1:5542:5432"]
    volumes: ["postgres-b:/var/lib/postgresql/data"]
  postgres-c:
    <<: *postgres
    ports: ["127.0.0.1:5543:5432"]
    volumes: ["postgres-c:/var/lib/postgresql/data"]
  postgres-d:
    <<: *postgres
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["postgres-d:/var/lib/postgresql/data"]
  postgres-transactional:
    <<: *postgres
    ports: ["127.0.0.1:5545:5432"]
    volumes: ["postgres-transactional:/var/lib/postgresql/data"]
  kafka:
    image: docker.io/apache/kafka:3.9.1
    profiles: ["kafka", "flink"]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  flink-jobmanager:
    image: docker.io/library/flink:1.20.0-scala_2.12-java17
    profiles: ["flink"]
    entrypoint: ["/bin/sh", "-ec", "chown flink:flink /opt/flink/checkpoints; exec /docker-entrypoint.sh jobmanager"]
    ports: ["127.0.0.1:8081:8081"]
    volumes: ["flink-checkpoints:/opt/flink/checkpoints:z"]
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
  flink-taskmanager:
    image: docker.io/library/flink:1.20.0-scala_2.12-java17
    profiles: ["flink"]
    entrypoint: ["/bin/sh", "-ec", "chown flink:flink /opt/flink/checkpoints; exec /docker-entrypoint.sh taskmanager"]
    depends_on: ["flink-jobmanager"]
    volumes: ["flink-checkpoints:/opt/flink/checkpoints:z"]
    environment: *flink-env

volumes:
  flink-checkpoints:
  postgres-a:
  postgres-b:
  postgres-c:
  postgres-d:
  postgres-transactional:
