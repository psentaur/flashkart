server {
    listen 8080;
    root /usr/share/nginx/html;
    location ~ ^/api/(products|sales|admin/(products|replicas))(/|$) { proxy_pass http://product-catalog:8080; }
    location ~ ^/api/admin/(sale-drafts|publications)(/|$) { proxy_pass http://flash-sale-manager:8080; }
    location ~ ^/api/attempts(/|$) { proxy_pass http://admission-controller:8080; }
    location ~ ^/api/orders(/|$) { proxy_pass http://order-service:8080; }
    location ~ ^/api/notifications(/|$) { proxy_pass http://notification:8080; }
    location ~ ^/api/analytics(/|$) { proxy_pass http://analytics-api:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
