apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flashkart
resources:
  - ../base
  - flink.yaml
  - observability.json
images:
  - name: flashkart-app
    newTag: dev
  - name: flashkart-flink
    newTag: dev
  - name: flashkart-web
    newTag: dev
  - name: flashkart-proxy
    newTag: dev
configurations:
  - kustomize-config.yaml
