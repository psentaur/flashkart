<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashkart · Products</title><link rel="stylesheet" href="/assets/base.css"><script type="module" src="/assets/sales.js"></script></head>
<body data-page="products"><header><a class="brand" href="/">flashkart<span> / limited releases</span></a><nav><a href="/operator/sales">Operator desk ↗</a></nav></header>
<main><p class="eyebrow">THE NEXT DROP</p><h1>Small runs.<br>Worth the wait.</h1><p class="intro">Discover upcoming releases and check the current sale terms.</p>
<section aria-labelledby="catalog-heading"><div class="section-heading"><h2 id="catalog-heading">Products</h2><button id="refresh-products" type="button" class="secondary">Refresh products</button></div><p id="catalog-message" role="status" aria-live="polite"></p><div id="products" class="grid"></div><button id="more-products" type="button" hidden>Load more</button></section>
<section class="panel"><h2>Find a release</h2><form id="product-lookup"><label>Product ID<input name="product_id" required placeholder="Product UUID" autocomplete="off"></label><button>View product</button></form><div id="product-detail" aria-live="polite"></div>
<form id="offer-lookup"><label>Sale ID<input name="sale_id" required placeholder="Sale UUID" autocomplete="off"></label><button class="secondary">Check current offer</button></form><div id="offer-detail" aria-live="polite"></div></section></main><footer>Sale terms are confirmed by Flashkart. All sale times are shown in UTC.</footer></body></html>
